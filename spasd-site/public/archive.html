<p>Prepared for a student-led informational meeting. This packet is not an official SPASD financial document and does not substitute for the district&#x27;s adopted budget, audit, or official financial statements.</p></template><template id="at-4b" data-title="Meeting Notes (August 18)" data-part="4. District Budget"><p>Meeting Notes (August 18) District Budget &amp; Long-Term Financial Planning — Meeting Preparation Notes (with notes from the meeting) Meeting with: Matt Clark, Director of Business &amp; Finance, Sun Prairie Area School District. Prepared by: Zackary Mark. Purpose: Understand district budgeting, long-term financial planning, and how financial decisions affect students and staff.</p>
<p class="li">1. Opening Thank Mr. Clark for meeting. Explain that I&#x27;m trying to better understand how district-level decisions are made, particularly financial decisions, from a student/community perspective, and that I keep records of meetings and correspondence so I can accurately document what I learn. Notes: Budget finalized every October. Monday there is a proposed budget meeting.</p>
<p class="li">2. Understanding the District Budget</p>
<p class="li">1. How does SPASD develop its annual budget from beginning to end?</p>
<p>Notes: 80% of expenses are staff; also busing, supplies, utilities. Revenue = expenses. Student numbers determine revenue (UW Applied Population Lab). 2-year budget cycle set by the Wisconsin government — how much money we get determines how much we can spend.</p>
<p class="li">2. Who is involved in developing the budget, and what responsibilities does each person or department have?</p>
<p class="li">3. At what point does the School Board become involved?</p>
<p>Notes: Meeting Monday with the school board. Formulas determine it. Budget talk starts in February, runs to October adoption — 8–9 months building the budget.</p>
<p class="li">4. What are the biggest sources of revenue for the district?</p>
<p class="li">5. How much flexibility does the district have over how those revenues are spent?</p>
<p class="li">6. What expenses make up the largest portions of the district budget?</p>
<p class="li">7. How does the district determine which programs or services receive funding?</p>
<p class="li">8. When the district has competing priorities, how are those priorities ranked?</p>
<p class="li">3. Long-Term Financial Planning</p>
<p class="li">9. How far into the future does SPASD typically plan financially?</p>
<p>Notes: 5-year budget forecast in February of every year — where will SPASD be in 5 years. Year-to-year process.</p>
<p class="li">10. What does the district&#x27;s long-term financial planning process look like?</p>
<p class="li">11. What financial assumptions are most important?</p>
<p>Notes: Enrollment drives revenue/everything. Staffing is the majority. Resident membership and revenue limit → tax levy → enrollment. State aid is a big assumption.</p>
<p class="li">12. How does the district account for changes in enrollment when planning several years ahead?</p>
<p class="li">13. What are the district&#x27;s biggest long-term financial risks right now?</p>
<p>Notes: Challenge is the state aid amount. Not much risk otherwise. Percent of funding is under inflation — funding is not what it should be; a Wisconsin problem. Trend: less enrollment coming in; housing costs high; small classes currently. Referendum: $25 million passed in 2024.</p>
<p class="li">14. Are there expenses or pressures that will become more significant over the next 5–10 years?</p>
<p class="li">15. How does the district prepare for unexpected financial changes?</p>
<p class="li">4. Staffing &amp; Compensation</p>
<p class="li">16. How significant are staffing costs within the overall budget?</p>
<p class="li">17. How does the district balance competitive compensation with financial stability?</p>
<p>Notes: $7 million of the referendum went to compensation; wage study; an operational deficit is eventually likely.</p>
<p class="li">18. How do staffing shortages or changing needs affect long-term planning?</p>
<p>Notes: Big short-term impact; long-term worry about maintaining current staffing. Special needs: different funding &quot;bucket&quot; — state funds special ed at about 30% of actual expense; general funding goes toward anything and helps fund the total; net zero at the end of the year. Staff based on needs and IEPs, no matter the cost.</p>
<p class="li">19. When adding or eliminating positions, what financial and educational factors are considered?</p>
<p class="li">20. How does the district evaluate whether staffing investments produce meaningful benefits for students?</p>
<p class="li">5. Student Impact</p>
<p class="li">21. How does SPASD evaluate the effect of financial decisions on students?</p>
<p>Notes: Initiatives taken into account; needed money aligned to what is said to be needed; Board and Superintendent tell them what is needed.</p>
<p class="li">22. Are student outcomes considered when determining whether a program continues receiving funding?</p>
<p class="li">23. How does the district balance efficiency with maintaining programs students value?</p>
<p class="li">24. How can students better understand how financial decisions affect their daily experience?</p>
<p>Notes: Keep asking specific questions; open door policy; student reps with the board.</p>
<p class="li">25. Are there opportunities for students to provide input on major financial priorities?</p>
<p>Notes: Specific feedback through student reps on the Board of Education.</p>
<p class="li">6. Difficult Financial Decisions</p>
<p class="li">26. What are some of the most difficult financial decisions recently?</p>
<p>Notes: State government, federal government, property taxes. About $2 million from federal grants. Title grants allocate money for the neediest schools — $160,000 less than last year. Cuts usually come from grants; Title funding is primarily used for Title staff. Don&#x27;t want to cut from Title schools.</p>
<p class="li">27. When reductions are necessary, how does the district decide where?</p>
<p>Notes: 80% is staff, determined by students. Class size guidelines; reductions informed by class-size ratio; non-renewing staff if not needed.</p>
<p class="li">28. How does the district prevent short-term decisions from creating long-term problems?</p>
<p class="li">29. Programs the district would like to invest in but can&#x27;t?</p>
<p>Notes: Big-picture ideas and superintendent goals: half-day vs. full-day 4K talks; PPA funding; Board priorities.</p>
<p class="li">30. What financial decision does the public most commonly misunderstand?</p>
<p>Notes: Majority misconception is that state aid = more revenue. In fact revenue limit minus state aid = tax levy, so more state aid means property tax relief — less taxes for people.</p>
<p class="li">7. Transparency &amp; Community Understanding</p>
<p class="li">31. What financial information should community members pay more attention to?</p>
<p>Notes: Key formulas (5 key formulas); Board meeting Monday; annual meeting open to the public in early October, at the high school this year; district goals; up-to-date budget.</p>
<p class="li">32. How can the district make financial information easier to understand?</p>
<p class="li">33. How transparent should the district be about long-term projections and challenges?</p>
<p>Notes: Almost fully. Board is public: current, future, what we can do, challenges, decisions. Transparency is key.</p>
<p class="li">34. What public information would you recommend reviewing?</p>
<p class="li">35. Common misconceptions you frequently encounter?</p>
<p class="li">8. Looking Forward</p>
<p class="li">36. If you could change one thing about how districts are funded?</p>
<p>Notes: Tie state aid (the amount per student) to inflation.</p>
<p class="li">37. What financial issue will have the greatest impact over the next five years?</p>
<p>Notes: Revenue per pupil not tied to inflation; not enough state funding; declining enrollment, projected to go down.</p>
<p class="li">38. What should students and community members pay attention to?</p>
<p>Notes: Advocate at the state level — alderperson, Congress person; tell stories about schools; state budget decisions; the state funds private schools differently.</p>
<p class="li">39. What is a financially healthy school district?</p>
<p>Notes: Fund balance metric — like a savings account, as a percentage of the budget. Healthy fund balance is more than 15–20%; SPASD is at 21%. Long term it won&#x27;t decrease. Annual audit; money left over.</p>
<p class="li">40. What would financial success look like five years from now?</p>
<p>Notes: Balanced budget! Find ways to be responsible, transparent, and effective; tied to student outcomes.</p>
<p class="li">9. Questions to Dig Deeper &quot;Could you explain what that looks like in practice?&quot; / &quot;What does that mean for students specifically?&quot; / &quot;How does the district measure whether that investment was successful?&quot; / &quot;Has that changed compared with previous years?&quot; / &quot;What would happen if that assumption changed?&quot; / &quot;Who ultimately makes that decision?&quot; / &quot;Is that something the public can see?&quot; / &quot;What is the biggest factor people tend to overlook?&quot; / &quot;If you were in my position trying to understand the district&#x27;s finances, what would you look at first?&quot;</p>
<p class="li">10. Closing Ask what financial documents, reports, or resources Mr. Clark recommends reviewing, and whether other district officials could help. Thank him. Main goal: The goal of the meeting is not simply to learn how much money SPASD has. It is to understand how the district turns limited resources into educational priorities, how it prepares for future financial pressures, and how students and the community can better understand and participate in those decisions.</p></template><template id="at-4c" data-title="Explainer: How the SPASD Budget Works" data-part="4. District Budget"><p>Explainer: How the SPASD Budget Works One-page explainer published on the SPASD Student Voice website, from the August 18, 2026 meeting with the Director of Business &amp; Finance. The short version: the district&#x27;s money mostly pays for people, the amount it gets depends on how many students enroll, and Wisconsin&#x27;s per-student funding hasn&#x27;t kept up with inflation.</p>
<p class="li">• Biggest cost: about 80% of spending is staff. The rest covers busing, supplies, and utilities.</p>
<p class="li">• Revenue: driven by enrollment through state formulas. Revenue must equal expenses.</p>
<p class="li">• Budget calendar: built over 8–9 months, starting in February, adopted in October.</p>
<p class="li">• Long-term plan: a 5-year forecast is updated every February.</p>
<p class="li">• 2024 referendum: $25 million passed; about $7 million went to staff pay after a wage study.</p>
<p class="li">• Savings: fund balance is about 21%. Around 15–20% is considered healthy.</p>
<p class="li">• Federal Title grants: about $160,000 less than last year. These fund the highest-need schools.</p>
<p class="li">• Special education: the state covers roughly 30% of actual cost; general funds cover the rest.</p>
<p>The most common misunderstanding: many people assume more state aid means more money for schools. Under Wisconsin&#x27;s revenue limit, the district can only collect a set amount. More state aid mostly lowers the local property tax levy instead of raising the total. Biggest risks ahead:</p>
<p class="li">• Per-student funding not tied to inflation</p>
<p class="li">• Enrollment projected to decline, partly due to housing costs</p>
<p class="li">• Possible operating deficit down the road as costs rise</p>
<p>How to follow along:</p>
<p class="li">• Watch Board of Education meetings and the annual public budget meeting each fall</p>
<p class="li">• Talk to the student representatives on the Board</p>
<p class="li">• Tell state lawmakers how school funding affects your school</p></template><template id="at-5" data-title="Where the plate reader record went" data-part="5. License Plate Reader Cameras (now on their own site)"><p>The license plate reader record (the community report, police records, Flock and Axon documents, and emails with the city) is part of the full archive, but it now lives on its own site so this one can stay about students and schools.</p>

<p>Weighted Grades: What Families Need to Know (student draft for the work group) A short explainer drafted by a student member of the SPASD weighted grades work group, October 2026. This is a recommendation. The School Board makes the final decision. What&#x27;s changing: right now, SPASD uses an unweighted 4.0 GPA, so an A counts the same in every class. The work group is recommending a 5.0 scale for the most challenging classes. In a weighted class, an A would count as 5.0 instead of 4.0. Which classes would be weighted (5.0 scale):</p>
<p class="li">• AP courses</p>
<p class="li">• Capstone classes, including try-out music courses</p>
<p class="li">• Classes that earn college credit or an industry certification</p>
<p>Not weighted:</p>
<p class="li">• College-credit or certification classes that match a class the high school already offers</p>
<p class="li">• Classes that don&#x27;t transfer for credit to UW colleges and universities</p>
<p>Counselors are reviewing the Madison College class list now. Every weighted class will be marked in the course guide so students know before they choose. Who it applies to: the recommendation is to start with students entering 9th grade in fall 2027 (the Class of 2031) and add a grade each year after that. Why not current students? Current high schoolers chose their classes under the old rules. Changing the rules partway through would reward some choices after the fact and not others, and it would change class rank for students who are already being ranked. Starting with a new class means every student in it knows the rules before choosing a single course. Open question for the work group: 69% of caregivers of current high schoolers asked for it to apply now. One option to consider is weighting classes taken from 2027–28 onward for every student, without recalculating past grades. Questions families asked:</p>
<p class="li">• Does it apply to my student? Under the recommendation, only to students starting 9th grade in fall 2027 or later.</p>
<p class="li">• Will past grades be recalculated? No. Grades already earned stay as they are.</p>
<p class="li">• How does it connect to Act 95 and college? Act 95 guarantees admission to Universities of Wisconsin schools for students in the top 10% of their class (top 5% for UW–Madison), so class rank matters. Many colleges also recalculate GPAs their own way. [District to confirm how weighted GPA will be used for class rank and shown on transcripts.]</p>
<p class="li">• Is it fair to students who can&#x27;t take AP? Weighted classes have to be open to every student who meets the prerequisites. [District to add how students get support to access these classes.]</p>
<p class="li">• How can I give input? The plan goes to the Board&#x27;s Teaching &amp; Learning Committee on November 2 (4:45 PM, District Service Center) and the full Board on November 9. Both meetings are open to the public.</p>
<p>Based on the work group&#x27;s October 15 and 20 recommendations and the caregiver survey (531 responses, October 16–22, 2026). Items in brackets need district confirmation before this is shared with families. Spanish version to follow.</p>
<p>Weighted Grades Board Kit (November 2 and 9, 2026) Before you go:</p>
<p class="li">• Nov 2, 4:45 PM: Teaching &amp; Learning Committee preview, District Service Center. Small table, two Board members. Best chance for a real conversation.</p>
<p class="li">• Nov 9: full Board of Education. Check the posted agenda for how to sign up for public comment, usually before the meeting starts. Comments are often limited to 2–3 minutes.</p>
<p class="li">• Bring printed copies of the one-page summary for Board members.</p>
<p>Public comment script (about 2 minutes): Good evening, President McFarland and members of the Board. My name is Zackary Mark. I&#x27;m a student in the district and a member of the weighted grades work group. In January, 31 students came to this Board to talk about Act 95. Since then, students have worked alongside district staff to build the plan you&#x27;re seeing tonight, and I want to share three numbers. First, 78%. That&#x27;s the share of students in last year&#x27;s Act 95 survey who chose some kind of weighted GPA. Second, 70%. That&#x27;s how many of the 531 parents and caregivers who answered this month support weighted grades, and it&#x27;s almost the same at West and East. Third, 69%. That&#x27;s how many caregivers of current high schoolers want this to apply to their students now. Our plan starts with next year&#x27;s freshmen, for good reasons, but those families deserve a clear answer about why, and I&#x27;d ask the Board to make sure that answer is part of how this is shared. This plan rewards students for challenging themselves, and it was built with students at the table. I hope you&#x27;ll support it, and I hope this is how more decisions get made in our district. Thank you.</p>
<p>Statement to be read for him if he can&#x27;t attend: Members of the Board, I&#x27;m sorry I can&#x27;t be here tonight; I&#x27;m at work. I&#x27;m a student on the weighted grades work group. Students asked for a fairer way to recognize challenging classes, and this plan does that. Students supported a weighted option in last year&#x27;s Act 95 survey (78%), and 70% of caregivers support it this month. I&#x27;d ask one thing: that the district clearly explain to current high school families why the plan starts with next year&#x27;s freshmen, since 69% of them hoped it would apply now. Thank you for including students in this decision. — Zackary Mark</p>
<p>Talking points for the Nov 2 committee preview:</p>
<p class="li">• Lead with the reason: the recommendation is built on rigor, and rigor was also caregivers&#x27; top factor (75%).</p>
<p class="li">• Name the timing split before a Board member hears it from a parent.</p>
<p class="li">• Ask how weighted GPA will be used for class rank under Act 95. Families asked this more than anything except timing.</p>
<p class="li">• Ask what support exists so every student can access weighted classes. That&#x27;s opponents&#x27; strongest point.</p>
<p class="li">• Offer students&#x27; help with the written explanation, since 72% of caregivers asked for one.</p>
<p>One-page handout for Board members: What Students and Families Said</p>
<p class="li">• Act 95 student survey (Dec 2025 – Jan 2026), 903 students: 78% of students who picked a ranking option chose a weighted GPA. 55% barely knew about Act 95 beforehand.</p>
<p class="li">• Caregiver survey (Oct 16–22, 2026), 531 caregivers: 70% support weighted grades. West 68%, East 73%.</p>
<p class="li">• Caregiver survey, timing (462 answered): current high school families 69% apply now; families with only younger kids 74% start next year.</p>
<p class="li">• Caregiver survey, classes: 85% want AP weighted. Top factor: rigor (75%).</p>
<p class="li">• Caregiver survey, communication: 72% want a detailed written explanation.</p>
<p>What families want answered: Does it apply to my student? How does it affect Act 95 and college admissions? Which classes count? Is it fair to students without access? Is the decision already made? Students&#x27; ask: approve the plan, and share it with a clear written explanation that answers current families directly. Both surveys were self-selected.</p>
<p>District Student Advisory Council: Pilot Plan (for Dr. Reed, Dr. Morgan and Ms. Bevenue) A spring 2027 pilot that can answer the shared goal from October 20: by June 2027, students can name something that changed because they spoke up. The idea in one sentence: a small group of students from every SPASD middle and high school meets with district leaders on a regular schedule, brings what students are saying, and hears back what happened to it.</p>
<p class="li">• Who: 3–5 students from each middle and high school (about 25–30 total), across grades, and reflecting each school&#x27;s racial, gender and program mix. This follows Dr. Reed&#x27;s August suggestion.</p>
<p class="li">• How students join: a short application open to every student (in English and Spanish), plus one seat per school saved for a student recommended by a counselor or teacher, to reach students who don&#x27;t usually apply.</p>
<p class="li">• Staff partner: one district leader who owns the council, plus a staff contact at each school. This is the first thing needed.</p>
<p class="li">• Meetings: four in the pilot (January, February, April and May 2027), 60 minutes, during the school day or right after, with a virtual option for middle schoolers.</p>
<p class="li">• Agenda: each meeting has one district topic leaders want student input on, one topic students bring, and updates on earlier input.</p>
<p class="li">• Closing the loop: within 30 days of each meeting, the district shares a short &quot;You said, we did&quot; update: what changed, what&#x27;s in progress, and what can&#x27;t happen and why.</p>
<p class="li">• Families: a parent team alongside, as Dr. Reed suggested, meeting twice during the pilot.</p>
<p class="li">• Cost: mostly staff time. Possibly snacks, printing and transportation for after-school meetings.</p>
<p>Timeline: November 2026 — name a staff partner and agree on the pilot plan · December 2026 — applications open at every school; wider student survey runs · January 2027 — members selected; first meeting on survey results and priorities · February–May 2027 — three more meetings, each followed by a &quot;You said, we did&quot; update · June 2027 — review the pilot with students, staff and the Board and decide whether to make it permanent. How we&#x27;ll know it worked:</p>
<p class="li">• Every middle and high school was represented at every meeting.</p>
<p class="li">• At least three &quot;You said, we did&quot; updates were published.</p>
<p class="li">• Students on the council can name at least one change that came from their input.</p>
<p class="li">• In a June survey, more students say they know where to bring an idea than in December.</p>
<p>The ask: name a staff partner by the end of November so applications can open in December.</p>
<p>Outreach &amp; Growth Plan (November–December 2026) Goal: get beyond the same small group. Reach every high school, every grade, and students who don&#x27;t usually speak up, which is what Dr. Morgan asked for on October 20. Where things stand: 39 Instagram posts and 29 followers, also on Threads; a website that installs as a phone app; a bilingual survey. The reach is still mostly one school and one friend group. Channels, ranked by reach:</p>
<p class="li">1. District student newsletter (starts November): survey link and blurb in the first issue — Ms. Bevenue (email drafted), by Nov 6</p>
<p class="li">2. SP30 at both high schools: teachers show the survey QR code once — Zack (email drafted), by Nov 13</p>
<p class="li">3. Student Council and Student Senate (West and East): repost the survey and the newsletter win — Zack, by Nov 6</p>
<p class="li">4. Flyers: get approval, then post at both high schools, the library and Kicks Unlimited — Zack, by Nov 13</p>
<p class="li">5. East High students: recruit 2–3 co-leads from East — Zack, by Nov 20</p>
<p class="li">6. Spanish-speaking families: share Spanish posts with ELL teachers and family liaisons — Zack, by Nov 20</p>
<p class="li">7. Middle schools: ask middle school principals to share the survey with 8th graders — Zack, in December after the council pilot is approved</p>
<p>Messages to send: DM to Student Council and Student Senate: Hey! I run @spasdstudentvoice. Last week the district confirmed students will start getting the district newsletter in November because we asked for it. We&#x27;re trying to get the student survey to every grade so district leaders hear from more than a few of us. Would you be willing to repost it to your story? Link&#x27;s in our bio. Thank you! DM to students at East: Hey, I&#x27;m Zack. I&#x27;ve been working with district leaders on student voice stuff, like weighted grades and getting students the district newsletter. Right now it&#x27;s way too West-heavy and I want East to have an equal say. Would you be down to help lead it with me? It&#x27;s mostly sharing what students at East care about and coming to a meeting or two. No experience needed.</p>
<p>Posting calendar: week of Oct 26 — &quot;You said, we did&quot;: newsletters (English + Spanish slides), Reel version · Nov 2 — caregiver survey carousel and Reel; story reminder for the Board committee · Nov 9 — story reminder for the Board meeting; recap post after · Nov 16 — district story with the interview (if published); survey push · Nov 23 — weighted grades final vote result; Thanksgiving post · Nov 30 — November monthly update · Dec 7 — advisory council applications (if approved); survey last call. What to measure: survey responses by school and grade (goal: at least 25 for every high school and grade); followers (goal: 100 by winter break); messages through the site&#x27;s form; new co-leads (goal: 3, including at least one from East).</p>
<p>Wider Student Survey: What Good Student Voice Looks Like The first step toward the June 2027 goal: ask students across the district what student voice working well looks and sounds like, then set goals from their answers. Planned in response to Dr. Morgan&#x27;s October 20 feedback. Who we need to hear from:</p>
<p class="li">• a district high school, grades 9–12: 25+ per grade, through SP30, Student Senate and the newsletter</p>
<p class="li">• Sun Prairie East, grades 9–12: 25+ per grade, through SP30, East co-leads and the newsletter</p>
<p class="li">• Prairie Phoenix Academy and Sun Prairie Virtual: as many as possible, through a staff contact at each</p>
<p class="li">• Middle schools (grade 8): a pilot with one or two schools, principal-approved, short version</p>
<p class="li">• Spanish-speaking students: included in every group, with a Spanish version and ELL teachers</p>
<p>Optional questions on school, grade, and how students describe their identity will check whether the people who answered match the district, and gaps will be reported honestly. Draft questions (5 minutes):</p>
<p class="li">1. Which school and grade are you in?</p>
<p class="li">2. Do you know where to bring an idea or concern at school? (Yes / Not sure / No)</p>
<p class="li">3. In the last year, did you ever see something change because students asked for it? If yes, what?</p>
<p class="li">4. When something serious happens at school, how do you usually find out? (District/school message, teacher, friends, social media, news, I don&#x27;t)</p>
<p class="li">5. Rate: &quot;Adults in my school listen to students&#x27; ideas.&quot; (1–5)</p>
<p class="li">6. What would student voice working well look or sound like at your school? (open)</p>
<p class="li">7. Which matter most to you right now? (pick up to 3: safety, mental health, grades and class rank, schedules, lunch, communication, fairness in discipline, clubs and activities, other)</p>
<p class="li">8. How would you want to hear back about student input? (newsletter, Instagram, in class, website, email)</p>
<p class="li">9. Would you want to be part of a student advisory council? (Yes / Maybe / No)</p>
<p class="li">10. Anything else district leaders should know? (open)</p>
<p>Timeline: November 2026 — share draft questions with Dr. Morgan, translate, get approval to share through district channels · December 1–18, 2026 — survey open, with weekly checks on who has answered · January 2027 — public, anonymous results report and three to five goals with benchmarks, shared with the advisory council at its first meeting · May 2027 — short follow-up survey for the June 2027 check-in. Privacy: anonymous by default, with no names or student IDs; results shared only as summaries, and quotes only when they can&#x27;t identify anyone; any serious safety concern a student writes about is passed to district staff, and the survey says so up front.</p>
<p>How to Start Student Voice at Your School (a guide for any student)</p>
<p class="li">1. Start with one clear letter. Write to your principal or School Board about one thing students are worried about. Say what happened, how it affects students, and two or three specific, doable asks. Keep it respectful. You&#x27;re asking to be part of the solution, not blaming anyone.</p>
<p class="li">2. Ask for a meeting, then write it down. Ask for 30 minutes. Bring a one-page handout. Take notes, and ask before recording. Within two days, email a short recap (&quot;so we all leave with the same notes&quot;). That recap is what turns a nice conversation into a commitment.</p>
<p class="li">3. Get real input, not just your friends&#x27;. Run a short anonymous survey in every language families speak. Share it through teachers and newsletters, not only social media. Report who answered, including who&#x27;s missing.</p>
<p class="li">4. Keep a public record. Post short updates: what you asked, what you were told, what changed. A free website and an Instagram account are enough. Give district leaders a chance to correct anything before you post it, and set a deadline.</p>
<p class="li">5. Track promises. Keep a &quot;You said, we did&quot; list. Every commitment gets an owner, a date and a status. Celebrate wins publicly; it&#x27;s the best proof that speaking up works.</p>
<p class="li">6. Join the groups that already exist. Work groups, Student Senate and Board student sessions are where decisions get made. Ask to join them before starting something new.</p>
<p class="li">7. Protect people. Don&#x27;t post names of students, private phone numbers, or rumors about staff. Stick to facts from public records and the news. If someone tells you they&#x27;re unsafe, help them reach a trusted adult right away.</p>
<p class="li">8. Make it last after you graduate. Recruit co-leads from different grades and schools early. Share passwords and files with them. Push for something permanent, like an advisory</p>
<p>council, so student voice doesn&#x27;t depend on one person. Handoff plan for SPASD Student Voice: recruit 3 co-leads by December 2026, including one from East and one underclassman; share the Instagram, website and records with them by March 2027; co-leads run the April and May updates; full handoff by June 2027.</p>
<p>&quot;You Said, We Did&quot;: Semester Update (template for the district) A suggested one-page format the district could publish twice a year (January and June), so every student can see what happened to their input. Suggested by students in the October 20, 2026 meeting with Dr. Morgan and Ms. Bevenue.</p>
<p class="li">• Opening (2–3 sentences): This semester, students shared ideas through [surveys, the student advisory council, Student Senate, meetings]. Here&#x27;s what we heard and what happened.</p>
<p class="li">• What changed: &quot;Students never got the district newsletter&quot; → newsletters now go to students as well as families (November 2026). &quot;Harder classes should count more toward GPA&quot; → [weighted grades decision, if approved]. [Student input] → [Action] → [Date].</p>
<p class="li">• In progress: &quot;Students want to know when outside agencies get involved and when parents are told&quot; → [student rights guide in progress], next update [date].</p>
<p class="li">• What we can&#x27;t do, and why: [student input] — [plain reason, naming the law when one applies] — [what we can do instead].</p>
<p class="li">• How to share an idea: [where students bring ideas: the advisory council rep at your school, the student survey, your principal, or a form]. Students should hear back within 30 days.</p>
<p>Tips: keep it to one page, write it for a 9th grader, publish it in the student newsletter and on the district website, and translate it into Spanish.</p></template><template id="at-8c" data-title="Student Voice Flyer" data-part="8. Instagram, Website, Newsletter &amp; Action Kit"><h4>Student Voice Flyer</h4>

<h4>Apply through the district</h4></template><template id="at-10b" data-title="How to Speak Up" data-part="10. Get Involved"><p>How to Speak Up How any student or family member can do what&#x27;s in this record.</p>
<p>Email a district leader</p>
<p class="li">1. Find the right person. The Who&#x27;s who page and the district website list roles.</p>
<p class="li">2. Keep it short: who you are, what you&#x27;re asking, and one clear question.</p>
<p class="li">3. Ask for something specific: an answer, a meeting, or a document.</p>
<p class="li">4. If there&#x27;s no reply after a week, follow up once, politely.</p>
<p>Speak at a Board of Education meeting</p>
<p class="li">1. Check the posted agenda on BoardDocs (go.boarddocs.com/wi/spasd/Board.nsf).</p>
<p class="li">2. Sign up for public comment the way the agenda describes, usually before the meeting starts.</p>
<p class="li">3. Plan for about three minutes. Say your name, your school, your point and one ask.</p>
<p class="li">4. Bring a written copy to hand in.</p>
<p>Talk to the Board&#x27;s student representatives They serve two-year terms, from the end of sophomore year through senior year. Recruiting starts in December and applications open in mid-January. You can reach the current reps any time.</p>
<p>Ask the city for public records Wisconsin&#x27;s public records law lets anyone ask for government records. Police records go through the city&#x27;s online records portal; other city records go to the City Clerk. Describe exactly what you want and the date range.</p>
<p>Comment on a city decision Email the Mayor and the committee, speak during public comment in Council Chambers at 300 E. Main St., or ask your alder where they stand. The City Clerk&#x27;s office can tell you how to sign up.</p></template><template id="at-10c" data-title="Email Templates" data-part="10. Get Involved"><p>Email Templates Fill in the brackets and keep it short.</p>
<p>Asking a district leader a question Subject: Question about [topic] Hi [Name], My name is [your name], and I&#x27;m a student at [school]. I&#x27;ve been following [topic] and want to make sure I understand it correctly. [One or two specific questions.] Thank you for your time. I&#x27;d be glad to talk if that&#x27;s easier. [Your name]</p>
<p>Asking for a meeting Subject: Could we meet about [topic]? Hi [Name], I&#x27;d like 15–20 minutes to talk about [topic]. I&#x27;m free [two or three times]. I can meet in person or online. Thank you, [Your name]</p>
<p>Following up Subject: Following up: [original subject] Hi [Name], I wanted to follow up on my email from [date] about [topic]. I know you&#x27;re busy. If someone else is the right person, I&#x27;d appreciate a pointer. Thank you, [Your name]</p>
<p>Public records request (Wisconsin) To the records custodian: Under Wisconsin&#x27;s public records law, I request copies of [describe the records] for the period [start date] to [end date]. Please send them electronically if possible. If you deny any part of this request, please explain why in writing. If any part is redacted, please release the rest.</p>
<p>Thank you, [Your name]</p></template><template id="at-10d" data-title="FAQ About These Projects" data-part="10. Get Involved"><p>FAQ About These Projects Is this official? No. SPASD Student Voice and Sun Prairie ALPR are independent, student-led projects. They are not run by the Sun Prairie Area School District, the City of Sun Prairie or the police department. Who writes it? Zackary Mark. Officials&#x27; words are quoted from their own emails, and every email is shown with its sender and date. Who pays for it? No one. There is no funding and no sponsor. Why are other students&#x27; names missing? Only Zackary&#x27;s name appears. Other students are described by their role (&quot;a work group member&quot;) to protect their privacy. Is anything left out? Yes: raw survey responses, raw meeting recordings and transcripts, personal matters and unrelated class projects. Nothing was left out to change what an official said. Can I join? Yes. DM @spasdstudentvoice or @sunprairiealpr, or email studentvoicesp@gmail.com (Student Voice) or sunprairiealpr@gmail.com (plate readers). No experience needed. What if something here is wrong? Email the project address above. Corrections are listed in the Corrections log with the date they were made.</p></template><template id="at-10f" data-title="How a Decision Gets Made" data-part="10. Get Involved"><p>How a Decision Gets Made Simplified. Exact steps vary; check the posted agenda for each meeting.</p>
<p>How a school district decision gets made</p>
<p class="li">1. Staff or a work group drafts it. Example: the weighted grades work group, with students in it.</p>
<p class="li">2. A Board committee or the Committee of the Whole discusses it. Example: Nov 2 (Teaching &amp; Learning Committee) and Nov 9 (Committee of the Whole).</p>
<p class="li">3. It goes on a regular Board meeting agenda for a vote. Public comment usually comes near the start.</p>
<p class="li">4. The Board votes. A majority passes it.</p>
<p class="li">5. District staff carry it out. That&#x27;s when &quot;you said, we did&quot; gets tested.</p>
<p>Where students can step in: join the work group, email Board members before steps 2 and 3, speak during public comment, and check that step 5 happens.</p>
<p>How a city budget decision gets made</p>
<p class="li">1. Departments request funding. Example: SPPD&#x27;s plan to move from Flock to Axon.</p>
<p class="li">2. Staff and the Mayor put together a proposed budget.</p>
<p class="li">3. Committees and budget work sessions review it. Example: Oct 27 and Nov 10 work sessions.</p>
<p class="li">4. The Common Council holds a public hearing and adopts the budget. Planned for Nov 17.</p>
<p class="li">5. Contracts and policies follow. The Axon contract, Policy F-18 and data-sharing agreements come after the money is approved.</p>
<p>Where residents can step in: email alders before step 3, speak at the budget hearing in step 4, and ask for contract terms to be public before step 5.</p></template><template id="at-10g" data-title="Lessons for Student Advocates" data-part="10. Get Involved"><p>Lessons for Student Advocates Practical things that worked this year, from the emails in this record.</p>
<p class="li">• Send the email. Most changes here started with one short, polite email to the right person.</p>
<p class="li">• Ask one clear question. &quot;Will these six terms be in the contract before the vote?&quot; gets a better answer than a long list of concerns.</p>
<p class="li">• Follow up once, kindly. Many replies came after a second email.</p>
<p class="li">• Put it in writing. After a meeting, send a recap of what was agreed. That&#x27;s how the newsletter commitment became a written one.</p>
<p class="li">• Find the right door. When someone says &quot;that&#x27;s not my call,&quot; ask who decides and go there.</p>
<p class="li">• Say what you&#x27;re not. Stating that the projects are independent heads off confusion.</p>
<p class="li">• Keep receipts. Save every email and note. This archive exists because of that habit.</p>
<p class="li">• Protect other students. Use roles, not names, in anything public.</p>
<p class="li">• Correct mistakes in public. A corrections log builds more trust than pretending to be perfect.</p></template><template id="at-10e" data-title="In Their Words: Anonymous Student &amp; Family Voices" data-part="10. Get Involved"><p>In Their Words: Anonymous Student &amp; Family Voices Anonymous words from students and families, copied as written. No names or identifying details. &quot;Yes I feel safe at school. Yes I would feel comfortable telling an adult. No adults do not listen.&quot; — a student, winter 2026 outreach &quot;Harder schedules should be rewarded.&quot; — a caregiver, October 2026 survey &quot;Extra incentive to take advanced classes&quot; — a caregiver, October 2026 survey &quot;Need more information. Pros and cons.&quot; — a caregiver, October 2026 survey &quot;Every class should have equal importance.&quot; — a caregiver, October 2026 survey &quot;It&#x27;s not equitable&quot; — a caregiver, October 2026 survey</p></template><template id="at-11c" data-title="Council Meeting Notes" data-part="11. Looking Ahead"><p>Council Meeting Notes Council meetings haven&#x27;t started yet. Once they do, notes will go here after each meeting, with students listed by school only.</p></template><template id="at-Aa" data-title="Who&#x27;s Who" data-part="A. Appendix"><p>Appendix Reference pages: people, the full timeline, corrections, statements and sources. IN THIS PART</p>

<p>I&#x27;m Zackary Mark, a student in the Sun Prairie Area School District. This work started in January 2026 with an email to the Board of Education about student safety and trust, and it kept growing from there: the Act 95 and weighted grades work group, the student voice survey and public reports, meetings with district leaders about the budget, mental health and student voice, and a community report on Sun Prairie&#x27;s license plate reader cameras. I&#x27;m not part of a formal organization. I do this on my own and alongside other students because I think young people should be able to understand the decisions that affect them and ask questions of the people who make them. Outside of advocacy, I teach martial arts at Kicks Unlimited in Sun Prairie, speak English and Spanish, and compete on the Forensics team. I plan to become a social studies teacher. I run two projects: SPASD Student Voice (spasdstudentvoice.netlify.app, @spasdstudentvoice) for student voice in the district, and Sun Prairie ALPR (sunprairiealpr.netlify.app, @sunprairiealpr), an independent look at the city&#x27;s license plate reader cameras.</p></template><template id="at-9z" data-title="Contact, Thank You &amp; What Changed in Each Update" data-part="B. About Me"><p>Contact</p>
