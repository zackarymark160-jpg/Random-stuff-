<h4>At a Glance: Where Things Stand</h4>
<h4>p. 9</h4>
<h4>Glossary</h4>
<h4>p. 10</h4>
<p>What happened Two cases involving former a district high school staff shaped how a lot of students feel about safety and trust in our district. These are the facts as reported in public court records and the news:</p>
<p class="li">• Robert Gilkey-Meisegeier, a former coach and dean of students, pleaded guilty in federal court to producing child sexual abuse material. On April 28, 2026, he was sentenced to 18 years in federal prison. A related state case was dismissed after the federal conviction.</p>
<p class="li">• Jennifer <span class="rd">a former principal</span>, a former principal, was charged with three misdemeanor counts of failing to report suspected child abuse. On June 25, 2026, she pleaded no contest to one count, the other two were dismissed, and she was placed in a deferred prosecution program. A no contest plea is not an admission of guilt, and she has not been convicted.</p>
<p>Students mostly learned about both cases through rumors and the news, not from the district. That gap is a big reason this work exists. Sources: WKOW, Apr 28, 2026 · WTMJ, Jun 1, 2026 · WMTV15, Jun 25, 2026 · Spectrum News, Jun 25, 2026. Status as of October 20, 2026.</p>
<p>Why I started In January 2026, I wrote to the Sun Prairie School Board after a hard stretch in our district left a lot of students unsure what happened and who to trust. I proposed a six-part Student Safety &amp; Trust Framework: clearer communication after serious incidents, a plain explanation of how reporting works, the same rules in every building, a real student voice, better mental health support, and regular check-ins on how it&#x27;s going. That letter turned into meetings with district leaders, a new Student Senate at a district high school, students helping choose a principal and a superintendent, a seat on the weighted grades work group, and a proposal for a district-wide Student Advisory Council. Along the way, the same questions about transparency led to meetings with the Sun Prairie Police Department about its license plate reader cameras. The goal hasn&#x27;t changed. Student voice should be a regular, documented part of how SPASD makes decisions, not something that depends on one student or one principal.</p>
<p>Why it&#x27;s important Students are the people most affected by what happens in our schools, but we&#x27;re usually the last to hear about it and the least likely to be asked. When something serious happens and nobody tells us anything, rumors fill the gap. That makes it harder to trust the adults who are supposed to keep us safe, and harder to speak up when something is wrong. In outreach this year, most students said they feel physically safe at school. The problem is follow-through. As one student put it: &quot;Yes I feel safe at school. Yes I would feel comfortable telling an adult. No adults do not listen.&quot; Decisions about grades, safety, communication, and leadership shape the next four years of our lives. Weighted grades and Act 95 decide who gets guaranteed admission to UW schools. How incidents are communicated decides whether we hear the truth or a rumor. Who leads our schools decides how all of that gets handled. Students should have a say before those decisions are final, not find out after. It also works when it&#x27;s done right. Students served on principal and superintendent interview panels, helped restart a Student Senate, shaped the weighted grades plan, and got the district to start sending its newsletters to every student. Those changes happened because students asked, followed up, and kept a record. The same goes beyond school. The license plate reader cameras affect everyone who drives in Sun Prairie, including students and their families. People deserve to know what&#x27;s being collected, who can see it, and how long it&#x27;s kept, in plain language.</p>
<p>Why this record exists I keep every email, invite, and set of notes so the conversations, answers, and commitments don&#x27;t get lost, and so anyone can check what was said and when. Student names have been removed, except mine. This is an independent, student-led record, not an official Sun Prairie Area School District document, and it is shared in good faith, not to accuse any person.</p>
<p>At a Glance: Where Things Stand Where things stand (November 10, 2026) •</p>
<p>WON newsletters to every student. Asked for at the Oct 20 meeting; the district confirmed in writing on Oct 21 that newsletters will go to students starting in November.</p>
<h4>•</h4>
<p>ANSWERED IN WRITING LGBTQIA+ protections unchanged (Oct 1).</p>
<h4>•</h4>
<p>WON students in the room for leadership hiring. Students sat on the the high school principal interviews and met the superintendent finalists (April).</p>
<h4>•</h4>
<p>WON a Student Senate restart at a district high school, with students elected in April.</p>
<h4>•</h4>
<p>MOVING weighted grades. Students helped write the plan and four of them previewed it with Board members on Nov 2. Next: student rehearsal and Board meeting Nov 9, a follow-up with district and school leaders Nov 17, final vote expected late November.</p>
<h4>•</h4>
<p>BUILDING a District-Wide Student Council. Proposed to Superintendent Dr. Reed on Oct 29 (&quot;I love this idea&quot;), discussed with him in person Nov 4, then opened to every middle and high school, grades 6–12. Patrick Marsh signed on Nov 5 with 3–5 Peer Ambassadors, Prairie Phoenix&#x27;s principal wrote that he is supportive, and Sun Prairie East offered its weekly newsletter and SP30, then said on Nov 10 it can&#x27;t share the invitation until the council is school-sponsored. Still open: how a district-level group registers and who sponsors it.</p>
<h4>•</h4>
<p>ANSWERED how Board student reps are chosen. Two-year terms; recruiting starts in December, applications open mid-January for sophomores.</p>
<h4>•</h4>
<p>ANSWERED IN WRITING license plate readers. SPPD&#x27;s written FAQ (Oct 16) and the Chief&#x27;s Oct 27 answers: a 14-day Axon retention trial, no livestreaming, monthly audits, and a public data-sharing MOU after signing. These are department statements, not contract terms yet.</p>
<h4>•</h4>
<p>ASKED IN WRITING plate reader records. Public records request for the Axon estimate, Policy F-18, data-sharing agreements and audit records, filed Nov 9. The Chief also said he&#x27;s open to a quarterly transparency report once Axon is approved.</p>
<h4>•</h4>
<p>WAITING the Mayor. Meeting requested Oct 2.</p>
<p>How to use this record Part 1 has every contact and every meeting in order. Parts 2–4 cover school district work, Part 5 the license plate reader project, Part 6 emails with the city, police, state and district, and Parts 7–8 the surveys and the public Student Voice pages. Emails appear as cards with the subject, sender, recipients and date. Anything marked as a department or district statement is what officials said, not a signed policy or contract.</p>
<p>Glossary</p>
<p class="li">• Act 95 — Wisconsin law that guarantees UW admission to top-ranked students, which is why class rank and how GPA is calculated matter.</p>
<p class="li">• ALPR — Automated license plate reader: a camera that photographs passing cars and reads the plate.</p>
<p class="li">• Axon — The company Sun Prairie plans to switch to for plate readers, starting May 2027.</p>
<p class="li">• Capstone — An advanced, project-based course; part of the weighted grades plan.</p>
<p class="li">• F-18 — SPPD&#x27;s written policy on license plate readers.</p>
<p class="li">• Flock — Flock Safety, the company behind Sun Prairie&#x27;s current plate reader cameras.</p>
<p class="li">• Fusus — Software that can pull camera feeds into a live view. The Chief said there will be no livestreaming.</p>
<p class="li">• Hotlist — A list of plates police are looking for, such as stolen cars. A match is an alert, not proof of a crime.</p>
<p class="li">• MOU — Memorandum of understanding: a written agreement between agencies, here about sharing plate data.</p>
<p class="li">• PSC — The City of Sun Prairie&#x27;s Public Safety Committee.</p>
<p class="li">• SP-ALPR — Sun Prairie ALPR, Zackary&#x27;s independent project on the city&#x27;s plate readers (sunprairiealpr.netlify.app).</p>
<p class="li">• SPASD — Sun Prairie Area School District.</p>
<p class="li">• SPPD — Sun Prairie Police Department.</p>
<p class="li">• the high school / the high school — a district high school. SPE is Sun Prairie East.</p>
<p class="li">• T&amp;L Committee — The Board of Education&#x27;s Teaching &amp; Learning Committee.</p>
<p class="li">• Weighted grades — A GPA scale where harder classes (AP, capstones, some dual credit) can count up to 5.0 instead of 4.0.</p>
<p class="li">• 287(g) — A federal program that lets local agencies help with immigration enforcement. SPPD says plate data won&#x27;t be shared with agencies in it.</p>
<p class="li">• Committee of the Whole — A Board of Education meeting where all members discuss an item in depth before a formal vote.</p>
<p class="li">• MTSS — Multi-tiered system of support: a school&#x27;s layered approach to academic and emotional help, from all students to those needing the most.</p>
<p class="li">• Outpost — Axon&#x27;s solar-powered plate reader camera, the model in the draft Sun Prairie estimate.</p>
<p class="li">• Peer Ambassadors — A Patrick Marsh student group whose members may join the student council pilot.</p>
<p class="li">• PLC — Professional Learning Center, 220 Kroncke Dr., where the Board of Education meets.</p>
<p class="li">• SP30 — Sun Prairie East&#x27;s daily advisory period, where announcements and slides are shared.</p>
<p class="li">• Public records request — A request under Wisconsin law for copies of government records.</p></template><template id="at-1a" data-title="Contacts" data-part="1. Contacts &amp; Meetings"><p class="li">1. Contacts &amp; Meetings Who Zackary has worked with and every meeting, first as one table and then in detail. IN THIS PART</p>

<p>Overview: Student Voice &amp; Safety Initiative STUDENT VOICE &amp; SAFETY INITIATIVE — Amplifying Student Voice • Sun Prairie Area School District. A Student Safety &amp; Trust Framework • Student Senate • Act 95 &amp; Weighted GPA • District Leadership Engagement • Civic Advocacy. Compiled by Zackary Mark • AVID Scholar • 2025–26 School Year – Present.</p>
<p>Meet the Advocate Zackary Mark — Student Advocate • AVID Scholar • a district high school &quot;Asking &#x27;Why?&#x27; can be the beginning of meaningful change.&quot;</p>
<p class="li">• Focus: Public policy, education, government, and civic engagement</p>
<p class="li">• On the ground: Active in SPASD Student Voices, Student Senate, and district safety/trust conversations since January 2026</p>
<p class="li">• Beyond the district: Engages city leadership directly — including public-safety technology oversight with the Sun Prairie Police Department</p>
<p class="li">• Looking ahead: Plans to pursue a double major in Social Studies Education and Political Science</p>
<p>The Journey: A Timeline of Student-Led Advocacy From a January email to the Board to an ongoing seat at the table with district and city leadership.</p>
<p class="li">• Jan 2026 — Framework Proposed: Proposes a Student Safety &amp; Trust Framework directly to the Board of Education.</p>
<p class="li">• Jan 26, 2026 — Act 95 Public Hearing: Student-led Act 95 group presents survey findings and a recommendation to the Board.</p>
<p class="li">• Feb–Mar 2026 — Student Support Check-Ins: Recurring working sessions with the high school administration and district staff begin.</p>
<p class="li">• Apr 2026 — Senate &amp; Interviews: Runs for Student Senate; joins the the high school principal interview team.</p>
<p class="li">• May 2026 — New Superintendent: Board selects Dr. Antoine Reed to lead SPASD starting July 1.</p>
<p class="li">• Jul 2026 — Civic Engagement: Meets with Sun Prairie Police Chief Kevin Warych on ALPR camera policy and oversight.</p>
<p>Where It Started: The Student Safety &amp; Trust Framework Proposed to the Board of Education in January 2026, aligned with DPI guidance on safe, supportive learning environments.</p>
<p class="li">1. Acknowledge &amp; Communicate — Clear communication when serious incidents occur, even when details can&#x27;t be shared.</p>
<p class="li">2. Safety &amp; Reporting Overview — A districtwide, accessible explanation of how concerns are reported, investigated, and resolved.</p>
<p class="li">3. Consistent Protocols — The same conduct and safety standards applied across every SPASD building.</p>
<p class="li">4. Strengthened Student Voice — Formal, ongoing advisory structures with required administrative response.</p>
<p class="li">5. Proactive Wellness Supports — Advisory time, manageable counselor caseloads, and clear pathways to help.</p>
<p class="li">6. Ongoing Review &amp; Reflection — Regular climate surveys and transparent public reporting on progress.</p>
<p>Project Overview: What the Student Voice Project Does</p>
<p class="li">• Represent — Give every student a seat in conversations that shape their education.</p>
<p class="li">• Gather — Collect honest, districtwide feedback through a bilingual student survey.</p>
<p class="li">• Advocate — Turn feedback into concrete asks, like a weighted GPA policy.</p>
<p class="li">• Connect — Build direct lines between students and district and city leadership.</p>
<p>Student Leadership: Student Senate Launched by the high school the principal for the 2026–27 school year, seeded directly by the Act 95 &amp; Weighted GPA student groups. &quot;I have been deeply impressed with your voice and agency on Act 95 and weighted grading.&quot; — the principal</p>
<p class="li">1. Two Paths to a Seat — Members join by student-body election (grade-level ballot) or by a fair drawing among Act 95 working-group volunteers.</p>
<p class="li">2. Grade-Level Representation — Nine senators elected in spring 2026, three each from the incoming 10th, 11th, and 12th grade classes.</p>
<p class="li">3. Direct Pipeline — Senate works with administration to set concrete goals and an action plan for 2026–27.</p>
<p class="li">4. Growing the Model — After being passed over for the first Senate cohort, Zackary proposed expanding Student Council&#x27;s role to include structured feedback — a reminder that advocacy adapts when one door doesn&#x27;t open.</p>
<p>Data Collection: Student Advocacy &amp; School Climate Feedback A bilingual (English/Español) survey, open to students, families, and staff, built around four focus areas identified in meetings with district leadership. Four focus areas:</p>
<p class="li">• Development of a Student Senate / advisory structure</p>
<p class="li">• Student involvement in leadership decisions (principal &amp; superintendent searches)</p>
<p class="li">• Communication &amp; transparency around safety, policy, and student services</p>
<p class="li">• Trust and consistency across schools</p>
<p>Sample questions:</p>
<p class="li">• &quot;Do you feel students currently have a meaningful voice in district decisions?&quot;</p>
<p class="li">• &quot;How would you rate communication to students about important issues?&quot; (1–5 scale)</p>
<p class="li">• &quot;Should students have a role in leadership decisions, such as principal or superintendent selection?&quot;</p>
<p class="li">• &quot;What specific changes would you like to see moving forward?&quot; (open response)</p>
<p>Policy Context: Why Act 95 Matters to Sun Prairie Students The law: Wisconsin Act 95 created the Wisconsin Guarantee and Direct Admit Wisconsin, giving guaranteed admission to University of Wisconsin System schools for top-ranked students in every graduating class. &quot;The sole criterion for ranking pupils shall be the pupil&#x27;s grade point average.&quot; — Wisconsin Act 95</p>
<p class="li">• Top 5% — Guaranteed admission to UW–Madison</p>
<p class="li">• Top 10% — Guaranteed admission to all other UW System schools</p>
<p>The problem for Sun Prairie: Class rank runs on GPA alone, and SPASD currently ranks students on an unweighted scale. An unweighted &quot;A&quot; in a study hall counts the same as an &quot;A&quot; in AP Calculus or AP Chemistry. Students who challenge themselves in honors and AP courses can be pushed out of the top 5% and 10% by peers with lighter schedules. 31 the high school students, including Zackary, organized as the Act 95 group, gathered student voice, and presented a recommendation at the January 26, 2026 Board hearing.</p>
<p>Our Ask: A Weighted GPA System for SPASD Give rigor its due weight, so students who take the hardest classes aren&#x27;t penalized under Act 95 ranking.</p>
<p class="li">• 4.0 — Standard scale today: an A is an A, regardless of course difficulty</p>
<p class="li">• 29 — the high school students organized in the Weighted GPA working group, alongside the Act 95 group</p>
<p class="li">• 5%/10% — The Act 95 rank thresholds that decide UW guarantee eligibility</p>
<p>What Student Senate is asking the Board to consider:</p>
<p class="li">1. Add weighted points for Honors, AP, and dual-enrollment coursework on the SPASD transcript scale.</p>
<p class="li">2. Model the change against three graduating classes to confirm it doesn&#x27;t create new inequities.</p>
<p class="li">3. Use the Student Advocacy survey to bring student and family sentiment directly into the board&#x27;s discussion.</p>
<p>Building Relationships: Meeting with District &amp; Building Leadership</p>
<p class="li">1. New Superintendent — Dr. Antoine Reed: Building a working relationship with SPASD&#x27;s incoming superintendent, who took office July 1, 2026.</p>
<p class="li">2. Board Leadership — Diana McFarland, Board President: Ongoing correspondence since January 2026 on the Safety &amp; Trust Framework and student representation.</p>
<p class="li">3. District Administration — Dr. Sarah Chaja-Clardy, Director of Secondary Teaching, Learning &amp; Equity: coordinates staff follow-through on student proposals.</p>
<p class="li">4. Building Leadership — the principal &amp; the associate principal, the high school Principal and Associate Principal: partners on Student Senate, the survey, and behavior-matrix feedback.</p>
<p>Civic Engagement: Beyond the District, Public Safety Oversight On July 10, 2026, Zackary met with Sun Prairie Police Chief Kevin Warych to discuss the city&#x27;s Flock ALPR camera program, applying the same transparency and accountability lens to city government.</p>
<p class="li">1. Purpose &amp; Use — What goals the cameras serve, and how many cases they&#x27;ve directly helped solve.</p>
<p class="li">2. Data &amp; Privacy — What&#x27;s captured, how long it&#x27;s retained, and who can access it.</p>
<p class="li">3. Oversight — Audit practices, misuse safeguards, and accountability if policy is violated.</p>
<p class="li">4. Community Trust — How resident feedback, including immigration-related concerns, shapes policy.</p>
<p>Approach: pro-public-safety, not anti-technology — seeking the same transparency for city surveillance tools as for school safety systems.</p>
<p>Moving Forward: Next Steps</p>
<p class="li">1. Field the Student Advocacy &amp; School Climate survey districtwide and report results to the Board</p>
<p class="li">2. Establish a recurring check-in with Superintendent Dr. Antoine Reed</p>

<p>Responses recorded: Mezei — none recorded. Dorner — none recorded. Fowler — none recorded.</p>
<p>Response from a teacher Do most students feel safe at school? In my opinion as a teacher, I feel about 60-70% of students feel safe. Safety to me could mean a few different things to different students. 1. Do they feel they are in a safe space overall to learn? Are they protected from the outside world? Active threats like people coming into the school to hurt them or others? 2. Do they feel they are in a safe space to learn within their classes? Are they comfortable with their peers enough to be vulnerable to learn? Are there people either harassing them or bullying them? Or are people just being jerks and unkind (which is still not ok, but not the level of bullying)?</p>
<p class="li">3. Do students feel they have adults they can connect with if they feel threatened for either reason 1 or 2? 4. Are the adults in the building able to actually help the student? How do we make sure we don&#x27;t have adults in the building who have questionable boundaries, or worse, manipulate students for their own gain? Or, even passively just ignore students&#x27; concerns?</p>
<p>If a serious concern occurred, do students generally feel comfortable reporting it to an adult? I think some students do. Usually, those students have been raised in safe spaces with adults who protect them and care for their needs, which makes them feel safe. However, we have students who are going to question everything a person does, even an adult, because of their past experiences. We can&#x27;t change that, so how do we make students know that we aren&#x27;t going to be a threat to them like perhaps adults in their past have been? Additionally, with everything that has happened in our school over the last few years, I feel students have every right to be wary of trusting adults, especially the adults who allow students to cross unhealthy boundaries (for instance, teachers that give students their personal cell number). Are student concerns consistently heard and followed up on? No. I think some students&#x27; concerns are heard, but that typically comes from certain groups of students that administration pays more attention to for one reason or another. One example would be students whose caregivers are VERY VOCAL when something doesn&#x27;t go their way and they threaten to make something public in the media because of it. One change that could most improve student safety, trust, or communication: New superintendent; new district leadership; new principal. More training for staff on how to help students address their problems. More accountability on staff to have healthy boundaries with students, while still maintaining healthy working relationships with them. More accountability on students for their behavior so that all students feel safe and can learn their best while in school.</p>
<p>Student Responses (word for word) Question sent: &quot;Hey! Quick question for a student project I&#x27;m working on with the district about safety and student voice. Do you mind answering a few super short questions? Do you feel safe at school most of the time? If something serious happened, would you feel comfortable telling an adult? Do you feel like adults actually listen when students report problems? What&#x27;s one thing you would change to make school feel safer or better? Totally optional, just trying to make sure real voices are heard. Thanks :)&quot; Response 1: &quot;Yes I feel safe at school. Yes I would feel comfortable telling an adult. No adults do not listen. Something I would do is make them get cops to pat people down before they enter cuz people be pulling up with knives.&quot; Response 2: &quot;Yes I do feel safe at school most of the time. I would not feel uncomfortable telling an adult. Yes I do like it when adults actually listen to the problems students report. I would add reminders for students that this is a safe space just so they do not forget and always know where to look for if they need a safe space.&quot;</p>
<p>Outreach to a fellow student (02/11/2026) Zackary asked a fellow student from the Act 95 group to answer the same questions, share them with other students, and possibly attend a few meetings. That student&#x27;s reply (02/16/2026): &quot;Most of the time yeah [I feel safe]. Depends on the adult and what happened... Yes [adults listen], because they are legally obligated to. Might not be because they think it is right or they care.&quot; His one change: actually monitor the bathrooms, where students gather to vape.</p>
<p>Meeting 1 Script — Student Advocacy Meeting (30 minutes, word-for-word with pauses) Purpose: Student safety, trust, communication, and influence in district leadership decisions (superintendent &amp; the high school principal searches). Goal: one concrete next step + follow-up plan. 0:00–2:00 — Opening &amp; Purpose. &quot;Thank you all for taking the time to meet today. [pause] I really appreciate your willingness to engage with students directly about districtwide concerns. [pause] The goal of this conversation is partnership and improvement in student safety, communication, and leadership processes. [pause] This isn&#x27;t about pointing fingers at anyone — it&#x27;s about understanding the system and making it better for everyone. [pause] Specifically, I want to talk about: how students experience safety and trust in schools; how student voice is heard and followed up on; and how leadership transitions, like the superintendent and the high school principal searches, can strengthen student trust and community engagement.&quot; 2:00–8:00 — Student Concerns Overview. &quot;I&#x27;ve organized districtwide student concerns into three main themes:</p>
<p class="li">1. Safety &amp; Communication — Students often rely on rumors or social media after incidents. Limited student-facing explanation after serious events. Students aren&#x27;t always sure how safety systems prevent future harm.</p>
<p class="li">2. Consistency &amp; Accountability Across Schools — Discipline and follow-up can feel inconsistent. Reports of bullying or harassment are not always clearly addressed. Students notice adults aren&#x27;t always held to the same standards.</p>
<p class="li">3. Student Voice &amp; Follow-Through — Some positive steps exist, like feedback opportunities, but many students aren&#x27;t aware. Limited structured voice for younger students. Students sometimes feel heard symbolically rather than systemically.</p>
<p>These themes are being experienced across multiple schools, not just the high school.&quot; 8:00–18:00 — Clarifying Questions &amp; Dialogue.</p>
<p class="li">• A. Safety Communication: &quot;How is student communication decided after serious incidents?&quot; &quot;Is there a consistent district process or timeline?&quot;</p>
<p class="li">• B. Accountability &amp; Consistency: &quot;How are complaints about staff or administrators reviewed?&quot; &quot;How does the district ensure consistent follow-through across schools?&quot;</p>
<p class="li">• C. Leadership Transitions: &quot;With the superintendent search and the high school principal search underway, how are student perspectives being incorporated into these decisions?&quot; &quot;How can community engagement strengthen trust during these transitions?&quot;</p>
<p class="li">• D. Student Voice Moving Forward: &quot;How will feedback from this conversation lead to concrete action?&quot; &quot;What ongoing structure ensures continued collaboration with students across all schools?&quot;</p>
<p>18:00–26:00 — Propose Concrete Next Steps. &quot;I&#x27;d like to focus on one primary next step and a backup. Options could include: districtwide student climate listening sessions; a clear student-facing safety communication protocol; an ongoing student advisory group with admin involvement; input opportunities for students in leadership searches. Which of these feels most realistic to begin with, and what would the timeline look like?&quot;</p>
<p>26:00–29:00 — Lock in Follow-Up. Confirm the agreed next step, who is responsible, the timeline/date for follow-up, and how students will be updated on progress. 29:00–30:00 — Closing. &quot;Thank you again for collaborating with students today. We&#x27;re committed to strengthening student safety, trust, and engagement districtwide, and we look forward to continued partnership and follow-through.&quot;</p>
<p>Meeting 2 — Follow-Up Meeting Script (30 minutes) Opening (0:00–2:00): Thank you again for meeting previously and for the time and care you&#x27;ve given to these concerns. My hope for today is to briefly review what progress has been made since February 25, look at any early outcomes for students, and then identify the next clear step and timeline moving forward. Progress Since Last Meeting (2:00–10:00): What specific actions have taken place since our last meeting related to student safety communication, consistency in follow-up to concerns, and opportunities for student voice or feedback? Who has been involved, what timelines are in progress, and what might students or families begin to notice changing? Evidence of Impact for Students (10:00–18:00): Are there any early signs of impact, even small ones — clearer communication, planned listening opportunities, steps toward surveys or feedback systems, clarified processes for handling concerns? If larger changes are still developing, what is the most realistic first visible step within the next 30 days? Identifying the Next Concrete Step (18:00–26:00): One clear next action, for example scheduling a student listening session, developing a draft student communication framework, piloting a student climate or trust survey, or creating an ongoing student advisory structure. What feels most achievable, and what timeline makes sense? Confirming Follow-Through (26:00–29:00): Confirm the agreed-upon next step, who is responsible, the expected timeline, and how students will be updated. Closing (29:00–30:00): Thank you again for your time, your openness to this conversation, and your continued support of students.</p>
<p>Questions to Ask — Measuring Impact</p>
<p class="li">1. Whether students pay attention: surveys or polls (&quot;Did you hear about this?&quot; &quot;Do you know how to report concerns?&quot;); participation tracking (Student Voices, town halls, board meetings); informal feedback from friends and student groups.</p>
<p class="li">2. Whether students speak up: track Student Voices attendance and who speaks; keep a record of questions, comments, or emails sent to the board/district; check anonymous reporting tools; ask clubs, AVID classes, or advisory groups if students feel comfortable sharing concerns.</p>
<p class="li">3. Whether the district follows through: updates from the board/district (newsletters, emails, websites); meeting minutes mentioning changes to policies, the behavior matrix, or safety plans; visible changes in classrooms, hallways, or offices; follow-up telling students how their feedback led to action.</p>
<p>Tracking sheet:</p>
<p class="li">• Students paying attention — Survey, meeting attendance — Track % who respond</p>
<p class="li">• Students speaking up — Number of comments/questions/emails — Track trends over time</p>
<p class="li">• District follow-through — Emails, website updates, classroom observations — Look for concrete actions</p></template><template id="at-2n" data-title="Student Senate Restart Framework" data-part="2. Student Voice &amp; District Engagement" data-clone="#r-senate"></template><template id="at-2h" data-title="Public Reports (April 2026)" data-part="2. Student Voice &amp; District Engagement"><p>Public Reports (April 2026) Report A — Student Advocacy and Progress Report (April 2026) Sun Prairie Area School District (SPASD). Prepared by: Zackary Mark. Date: April 2026.</p>
<p>Executive Summary Since January 2026, student-led advocacy has driven measurable progress toward stronger student safety, trust, transparency, communication consistency, and authentic student voice within the Sun Prairie Area School District. Beginning with a formal proposal to the Board of Education and advancing through collaborative meetings and structured initiatives, these efforts have resulted in the launch of the Student Senate at a district high school, expanded student participation in leadership selection, and ongoing work to improve district systems. While foundational steps have been achieved, several areas remain in development. Sustained implementation, clear accountability measures, and districtwide scaling will be critical to embedding student perspectives into SPASD&#x27;s operations and creating long-term improvements in school climate.</p>
<p>Purpose of This Report The purpose of this report is to document the journey of student-led advocacy, highlight concrete progress made to date, provide transparency on current initiatives, and outline clear recommendations for sustained improvement. It serves as both a record of achievements and a roadmap to ensure student voice translates into meaningful, long-term systems that enhance school climate, safety, and shared decision-making across SPASD.</p>
<p>Key Definitions</p>
<p class="li">• Student Voice: The structured and meaningful inclusion of student perspectives in school climate, safety, communication, and decision-making processes.</p>
<p class="li">• Student Safety and Trust Framework: The January 2026 proposal submitted to the Board of Education that outlines actionable steps for improved incident communication, consistent safety protocols, transparent reporting, formal student advisory structures, and proactive mental health supports.</p>
<p class="li">• Student Senate: A formal, elected representative body designed to provide ongoing student input on school-related issues, collaborate with administration, and contribute to problem-solving and goal-setting.</p>
<p class="li">• Shared Decision-Making: The practice of including students, alongside administrators and the Board, in leadership selection, policy development, and continuous improvement efforts.</p>
<p class="li">1. Background and Timeline of Student Advocacy Student concerns regarding school climate, safety, communication after serious incidents, and consistency in district practices prompted structured advocacy efforts.</p>
<p class="li">• January 13, 2026: Submission of the &quot;Student Safety, Trust, and a Proposed Framework&quot; to the SPASD Board of Education. The proposal addressed gaps in incident communication, reporting transparency, cross-building consistency, student advisory structures, mental health supports, and continuous improvement processes.</p>
<p class="li">• January–February 2026: Individual responses received from Board members affirm the importance of transparency and student voice.</p>
<p class="li">• March 2, 2026: Student Advocacy Meeting with district leadership. The agenda focused on safety and communication systems, consistency and accountability across schools, and the role of student voice in leadership decisions.</p>
<p class="li">• March–April 2026: Follow-up communications on Student Senate development, mandated reporting clarity, and student involvement in the a district high school principal search.</p>
<p class="li">• April 2026: Rollout of the Student Senate interest form, application period, elections, and coordination of student participation in principal interviews.</p>
<p class="li">2. Student Safety, Trust, and Proposed Framework The January 2026 framework proposed a comprehensive, DPI-aligned approach to rebuilding</p>
<p>trust. Core components:</p>
<p class="li">• Clear acknowledgment and communication when serious incidents occur, even when full details cannot be shared.</p>
<p class="li">• Districtwide overview of safety and reporting processes, including roles of administration, district leadership, and external authorities.</p>
<p class="li">• Consistent implementation of safety and conduct protocols across all schools to address observed variations in handling similar situations.</p>
<p class="li">• Strengthened student voice through formal advisory structures at middle and high school levels with required administrative responses.</p>
<p class="li">• Proactive mental health and wellness supports, including regular advisory time and accessible counseling pathways.</p>
<p class="li">• Ongoing review and reflection via regular climate surveys, transparent reporting, and public discussion of improvement efforts.</p>
<p>Board Response (January 20, 2026): The Board acknowledged the concerns, emphasized legal/privacy constraints, highlighted actions already taken (such as releasing independent investigator reports and maintaining a dedicated FAQ website), and committed to continued attention through school liaisons and student representative recruitment. Current Status: Transparency initiatives are advancing, with district leadership focusing on clearer student-facing communication regarding reporting escalation, parent notifications, and post-incident messaging.</p>
<p class="li">3. Student Advocacy Meeting Outcomes (March 2, 2026) The meeting established a foundation for collaborative, solution-oriented engagement. Primary discussion areas included student safety and communication systems; consistency and accountability in districtwide practices; and integration of student perspectives into leadership decisions and formal processes. The meeting shifted focus from identifying concerns to developing structured next steps with measurable outcomes.</p>
<p class="li">4. Establishment of the Student Senate District leadership initiated planning for a representative Student Senate to institutionalize student input beyond one-time feedback opportunities.</p>
<p class="li">• Introduced in April 2026 for full implementation in the 2026–2027 school year.</p>
<p class="li">• Composition: Three students per grade level (9th, 10th, and 11th graders serving in the following year) plus additional members from student clubs and organizations.</p>
<p class="li">• Selection Process: Student-wide elections following an interest/application period (deadline April 22, 2026). Elections held April 27, 2026, with a revised ballot issued to correct initial technical errors.</p>
<p class="li">• Purpose and Goals: Serve as a formal voice for peers; identify school climate concerns; collaborate with administration on communication systems and problem-solving; develop concrete goals and strategic action plans.</p>
<p>Elected representatives were announced April 29, 2026: three incoming seniors, three incoming juniors, and three incoming sophomores. Observations: High student interest was evident. However, initial ballot errors temporarily affected trust in the process. Discussions also explored incorporating students from Act 95 and the Weighted GPA initiative groups.</p>
<p class="li">5. Student Involvement in Leadership Selection A significant milestone was the invitation for students to participate in the a district high school principal interview process. Interview dates (April 3 and April 7, 2026) were coordinated, providing students a direct opportunity to evaluate leadership candidates on priorities including safety, communication, and student voice.</p>
<p class="li">6. Communication and Transparency Initiatives District leadership is actively addressing inconsistencies in how information reaches students following incidents and clarifying student services processes. Focus areas:</p>
<p class="li">• Evaluation of existing communication protocols and identification of gaps in student-facing messaging.</p>
<p class="li">• Increased clarity on mandated reporting: when and how reports escalate to external agencies, parent/guardian notification procedures, and accessible information for students.</p>
<p class="li">• Development of more timely, consistent, and transparent communication systems.</p>
<p>Current Status: These improvements remain in progress and constitute a critical area for building long-term trust.</p>
<p class="li">7. Challenges and Observations</p>
<p class="li">• Transition from informal feedback to structured involvement is underway, but success depends on administrative timelines and system capacity.</p>
<p class="li">• Technical issues during Student Senate elections highlighted the need for robust process review.</p>
<p class="li">• Popular election promotes broad participation but may benefit from hybrid selection methods to better include highly engaged students.</p>
<p class="li">• Student Senate provides an important avenue for voice, yet complementary structures are needed to fully utilize experienced advocates and prevent over-reliance on a single body.</p>
<p class="li">8. Recommendations</p>
<p class="li">• Institutionalize the Student Senate with clear governance, meeting schedules, defined influence on school decisions, and mechanisms for administrative accountability.</p>
<p class="li">• Expand Student Voice Pathways by creating additional advisory, liaison, and committee roles to complement the Senate.</p>
<p class="li">• Enhance Election and Selection Processes through rigorous pre-launch review and consideration of hybrid models (application + election).</p>
<p class="li">• Advance Communication Systems by finalizing standardized protocols for incident response and student services transparency, with regular updates to the community.</p>
<p class="li">• Strengthen Accountability via regular progress reporting, climate surveys, 100-day goal check-ins, and measurable indicators.</p>
<p class="li">• Scale Districtwide by extending successful practices, such as student participation in principal and superintendent searches, to other schools and levels.</p>
<p class="li">9. Survey The bilingual &quot;Student Advocacy Feedback / Comentarios sobre la defensa de los estudiantes&quot; form is reproduced in full in the Surveys &amp; Feedback part of this document. Respondent link: <a href="https://forms.gle/pQsxiPcCcrp9tB1j6" target="_blank" rel="noopener">https://forms.gle/pQsxiPcCcrp9tB1j6</a></p>
<p>Conclusion The advocacy efforts of recent months illustrate the power of persistent, constructive student engagement when met with responsive district leadership. The proposed Safety and Trust Framework, Student Advocacy Meeting, launch of the Student Senate, and student involvement in principal selection mark important progress toward a more transparent, consistent, and student-centered school district. Long-term success will depend on converting these early initiatives into embedded systems. By maintaining collaboration, ensuring accountability, and prioritizing student voice in decision-making processes, SPASD can establish a model of shared responsibility that enhances safety, trust, and educational excellence for all students.</p>
<p>Report B — Student Advocacy Report #2: Progress Update on Student Voice, Communication, and Leadership Engagement Executive Summary Following the initial Student Advocacy Meeting, continued efforts have been made to advance districtwide priorities related to student voice, communication transparency, and system-level consistency. While several initiatives remain in development, meaningful steps have been taken to integrate student perspectives into both ongoing discussions and formal leadership processes.</p>
<p>Background The March 2, 2026 Student Advocacy Meeting established a foundation for collaborative engagement between students and district leadership, focused on student safety and communication systems; consistency and accountability across schools; and the role of student voice in leadership decisions and district processes. The goal was not only to identify concerns, but to transition toward structured, solution-oriented next steps with measurable outcomes.</p>

<p class="li">2. Student Involvement in Leadership Selection — Students have been invited to participate in the a district high school principal interview process. This creates a direct opportunity to influence leadership priorities, values, and communication approaches.</p>
<p class="li">3. Student Services &amp; Communication Transparency (In Progress) — District leadership is working to provide increased clarity regarding student services processes, particularly mandated reporting: when and how reports are escalated to external/state agencies; when and how parents/guardians are notified; and how information is communicated to students clearly.</p>
<p class="li">4. Continued Focus on Communication Systems — Initial discussions highlighted inconsistencies in how information is communicated to students following incidents. Priorities: evaluating existing protocols, identifying gaps in student-facing communication, and exploring more consistent, timely, and transparent messaging.</p>
<p>Current Status Overview</p>

<p>Key Observations</p>

<p>Conclusion Student voice is most effective when it is not only heard, but embedded into the processes that shape the district. Continued collaboration between students and district leadership will be essential in ensuring that progress remains steady, measurable, and aligned with the needs of the broader student community.</p>
<p>Report C — Public Report on Student Safety, Voice, and Communication (February 2026) Prepared by: Zackary Mark, Student Representative. Status: Public Community Document.</p>
<p>I. Purpose The purpose of this report is to document student-led efforts to understand and strengthen student safety (physical, emotional, and psychological), student voice in decision-making, and communication transparency between students, staff, families, and district leadership. This report is not an accusation against any individual or institution. Its purpose is constructive transparency and continuous improvement in support of students.</p>
<p>II. Definitions</p>
<p class="li">• Student Safety includes physical protection, emotional wellbeing, and confidence that school systems will respond appropriately to concerns.</p>
<p class="li">• Student Voice refers to structured opportunities for student perspectives to meaningfully influence school or district decisions.</p>
<p class="li">• Transparency is clear, timely, and accessible communication of processes, actions, and outcomes within legal privacy limits.</p>
<p class="li">• Accountability means consistent policy implementation, visible follow-through on concerns, and equitable standards across schools.</p>
<p>III. Background During the 2025–2026 school year, student discussions within SPASD highlighted recurring themes: questions about how safety concerns are reported and addressed; uncertainty about whether student reports lead to visible action; and desire for stronger student involvement in district decisions. In response, a student-led engagement effort was initiated to gather voluntary perspectives and encourage constructive dialogue with district leadership.</p>
<p>IV. Method of Engagement Direct outreach to middle and high school students; voluntary written student responses to standardized safety questions; outreach to teachers, staff, and administrators; public community communication via social media; and preparation for collaborative meetings with district leadership. Participation has been voluntary and informal at this stage.</p>
<p>V. Preliminary Observations (Non-Statistical) Many students report feeling generally safe physically. Some students express uncertainty about adult follow-through. Concerns exist regarding whether reports are consistently heard. Students show interest in clearer procedures and communication.</p>
<p>VI. Risks and Limitations Small and voluntary response sample; possible participation bias; ongoing data collection; privacy laws restricting the disclosure of incidents; variation in experiences across schools.</p>
<p>VII. Actions Completed to Date Initiated student-led safety and voice inquiry; developed a standardized student question set; collected initial voluntary student responses; conducted outreach to staff and administrators; began community awareness through social media; prepared documentation for district discussion.</p>
<p>VIII. Actions Currently in Progress Continued student response collection; expansion of outreach to additional schools and grade levels; preparation for February 25 administrative meeting; organization of documentation and communication materials.</p>
<p>IX. Actions Recommended Next (0–90 Days)</p>
<p class="li">• Immediate (0–30 days): Conduct a district-supported student listening session or distribute a brief student climate and trust survey.</p>
<p class="li">• Short term (30–60 days): Public summary of themes that protects confidentiality; identification of priority safety and communication needs.</p>
<p class="li">• Near term (60–90 days): Establish an ongoing student advisory or feedback structure; define clear communication pathways for student concerns.</p>
<p>X. Social Media and Community Engagement Status Public informational posts inviting voluntary participation; encouragement of student, family, and staff dialogue; emphasis on constructive collaboration rather than criticism. Engagement remains early-stage but positive.</p>
<p>XI. Relationships and Collaboration Respectful outreach to students across grade levels, teachers and school staff, school and district administrators, and families and community members, emphasizing voluntary participation, respectful dialogue, and shared commitment to student wellbeing.</p>
<p>XIII. Good-Faith Statement All actions described in this report were conducted in good faith with the intent to improve student safety and wellbeing, strengthen trust and communication, and support collaborative solutions within SPASD. No portion of this report is intended to defame, accuse, or target any individual.</p>
<p>XIV. Conclusion This student-led effort represents an early but meaningful step toward greater transparency, stronger student voice, and improved trust in safety systems. Sustained engagement, structured data collection, and clear communication will be essential to long-term progress.</p>
<p>XV. Public Release Notice This document is suitable for community awareness, educational discussion, administrative planning, and civic learning and student leadership development. It should be interpreted as a constructive public report, not a legal claim.</p></template><template id="at-2m" data-title="Meeting Packet: Dr. Taren Turner (August 27)" data-part="2. Student Voice &amp; District Engagement"><p>Meeting Packet: Dr. Taren Turner (August 27) STUDENT VOICE • STRONGER TOGETHER — Meeting Brief &amp; Discussion Guide Zackary Mark + Dr. Turner. Thursday, August 27, 2026, 11:30 AM–12:30 PM, District Support Center.</p>

<p>The proposal: a District Student Advisory Council pilot The proposal is a one-semester pilot of a small, district-wide student council with a staff partner, reviewed before it expands. Every detail below is a starting point for discussion.</p>
<p class="li">• Members: students from Prairie View, Patrick Marsh and Central Heights middle schools, East, West and Prairie Phoenix Academy, across grades and backgrounds</p>
<p class="li">• Selection: a short application plus a fair draw, so it reaches beyond the students who are already involved</p>
<p class="li">• Staff partner: one named district staff member who keeps records and follow-through, without directing recommendations</p>
<p class="li">• Meetings: regular, on a set calendar with district leadership; agendas posted 24–48 hours ahead, minutes within 72 hours</p>
<p class="li">• Role: advisory; consulted on major student-facing changes before they are final</p>
<p class="li">• Relationship to existing groups: works alongside the the Student Senate and the student Board representatives, not in place of them</p>
<p class="li">• Pilot length: one semester, then a review of what worked</p>
<p>How a student concern would become action:</p>
<p class="li">1. Students raise an issue through the survey, a Senate, a club or a council member.</p>
<p class="li">2. The council gathers input from more schools and documents it.</p>
<p class="li">3. A written recommendation goes to district leadership.</p>
<p class="li">4. The district responds in writing: yes, no, or not yet, and why.</p>
<p class="li">5. A short public update tells students what changed, what didn&#x27;t, and why.</p>
<p>Where each office could fit:</p>
<p class="li">• Strategic Communications: student-facing messages after serious incidents, channels that reach students, and a home for public updates (step 5).</p>
<p class="li">• Systemic Equity &amp; Inclusion: a membership that reaches students who are usually underrepresented, Spanish-language access, and climate and belonging across buildings.</p>
<p>Discussion questions Starred ones are the priority if time runs short. Where we agree on the goal</p>
<p class="li">• ★ If student voice in SPASD is working well by June 2027, what would each of us see that we don&#x27;t see today?</p>

<p>Communication (Strategic Communications)</p>
<p class="li">• ★ After a serious incident, how is it decided what students are told, how fast, and by whom? What legally can&#x27;t be shared, and how can we explain those limits to students?</p>
<p class="li">• Which channels does the district know actually reach students, and how is that measured?</p>
<p class="li">• What would a twice-a-year &quot;you said, we did&quot; update need in order to be realistic: who writes it, where it lives, and who approves it?</p>
<p>Equity and inclusion (Systemic Equity &amp; Inclusion)</p>

<p class="li">• How should council members be chosen so it isn&#x27;t the same small group of already-involved students?</p>
<p class="li">• What existing focus groups, affinity groups or listening sessions could a council build on instead of starting from scratch?</p>
<p>Making a student group last</p>
<p class="li">• ★ Which office or role is the right long-term home for a district student council?</p>
<p class="li">• What upcoming decisions this year could get student input before they are final?</p>

<p>From heard to &quot;here&#x27;s what changed&quot; What students learned from district leaders about incident communication, the first &quot;you said, we did&quot; commitment, and what student voice should look like by June 2027. Meeting with SPASD district leaders, Tuesday, October 20, 2026. Prepared by Zackary Mark, Student Advocate.</p>
<p>01 At a glance Two SPASD directors met with student advocates and made one concrete commitment on the spot.</p>
<p class="li">• Commitment: district newsletters launching in November will go to all students, not just families.</p>
<p class="li">• Incident communication: what students hear depends on direct impact, age and severity. Some details can&#x27;t be shared by law.</p>
<p class="li">• Shared goal: by June 2027, students should be able to name something that changed because they spoke up.</p>
<p class="li">• What&#x27;s next: a wider, more representative survey on what good student voice looks and sounds like.</p>
<p>02 Who we met and why</p>
<p class="li">• Dr. Michael D. Morgan Jr. — Director of Systemic Equity &amp; Inclusion, SPASD</p>
<p class="li">• Marlita Bevenue — Director of Strategic Communications, SPASD</p>
<p class="li">• Zackary Mark — Student Advocate, SPASD Student Voice</p>
<p>The goal was to move student voice from being heard to being connected to action. We ran out of time before discussing a district student advisory council and equity questions, and plan to pick those up at a follow-up meeting.</p>
<p>03 How incident communication works today Safety comes first, facts come second, and the message comes after that. Dr. Morgan noted his answers reflected his own understanding, not a formal written district protocol. What decides whether students are told:</p>
<p class="li">• Direct impact. An incident at one school is unlikely to be shared with students at a school it didn&#x27;t affect.</p>
<p class="li">• Age of students. Messages are shaped to be age-appropriate.</p>
<p class="li">• Severity. More serious incidents get more communication and come from higher up.</p>
<h4>The steps, as Ms. Bevenue described them:</h4>
<p class="li">1. Make sure everyone is safe and accounted for.</p>
<p class="li">2. Communications works with the principal and district leadership to confirm facts.</p>
<p class="li">3. Decide who is affected, what each audience needs, and what&#x27;s ready to share.</p>
<p class="li">4. Her team prepares and reviews the message.</p>
<p class="li">5. It comes from the principal, district leadership, or the superintendent, based on severity.</p>
<p class="li">6. More information follows as it&#x27;s confirmed.</p>
<p>What can&#x27;t be shared, and why:</p>
<p class="li">• Names of students involved — student privacy laws; many involve minors</p>
<p class="li">• Individual consequences and discipline — protected student records</p>
<p class="li">• Grades and other student records — protected student records</p>
<p class="li">• Personnel matters — employee protections; directors often don&#x27;t have the details either</p>
<p>Both directors stressed accuracy. Rumors on social media can spread faster than the district can verify facts, and sending wrong information would hurt trust more than a short delay.</p>
<p>04 What students asked for Hear something reliable from the district, even when details can&#x27;t be shared, because silence gets filled by rumors.</p>
<p class="li">• Short, factual messages: even with no names, &quot;a medical incident closed this area, here&#x27;s what you need to know&quot; takes five minutes and stops rumors.</p>
<p class="li">• Name the law: when something can&#x27;t be shared because of a law, say which one. Many students will look it up.</p>
<p class="li">• Trust students&#x27; understanding: students often feel information is held back because adults assume they won&#x27;t get it. Most do.</p>
<p class="li">• &quot;You said, we did&quot; updates: follow up on what actually happened, even if it&#x27;s &quot;nothing changed yet, here&#x27;s what&#x27;s happening.&quot;</p>
<p>Ms. Bevenue agreed students should hear directly from the district so they have a reliable source: clarify what&#x27;s known, correct inaccurate information, and explain what&#x27;s still being learned.</p>
<p>05 You said, we did: newsletters to all students Starting in November, district newsletters will go to every student, not only to families.</p>
<p class="li">• You said: in four years of high school, I had never received a district newsletter, and neither had many students I know.</p>
<p class="li">• The district said: students were assumed to get family newsletters as part of the household. Dr. Morgan called it a process improvement, not intentional.</p>
<p class="li">• The commitment: Ms. Bevenue will make sure newsletters go to all students when they launch in November with Superintendent Dr. Antoine Reed.</p>
<p>This is exactly the kind of change student voice is supposed to produce. We&#x27;ll report back once the first newsletter goes out.</p>
<p>06 What success looks like by June 2027 Students should be able to name something that changed because they spoke up, and the goals should come from students themselves.</p>
<p class="li">• Ask students first: with about 8,500 students from 4K to 12th grade, Dr. Morgan said the first step is to survey students in age-appropriate ways on what student voice working well looks and sounds like. For the youngest learners, that may mean asking families.</p>
<p class="li">• Set goals with benchmarks: not every idea can happen by June. A realistic plan might commit to a few changes by June 2027, a few more by fall 2027, and keep going into 2028.</p>
<p class="li">• Close the loop: Ms. Bevenue said students should know where to bring an idea and hear back what happened, even if the answer is &quot;we can&#x27;t do that, and here&#x27;s why.&quot; She encouraged students to be specific.</p>
<p class="li">• What would show progress: a district-wide student survey, a district student advisory council with middle and high schoolers, and regular &quot;you said, we did&quot; updates.</p>
<p>07 Weighted grades update The student work group agreed weighted grades should start with the Class of 2031 in 2027–28.</p>
<p class="li">• Which classes: a 5.0 scale for capstone classes, tryout-based music courses, and classes earning industry certification or college credit.</p>
<p class="li">• Exceptions: college classes that don&#x27;t transfer to UW schools, or that match electives or requirements the high school already offers.</p>
<p class="li">• Why freshmen: current students already chose classes under the old system, so switching now wouldn&#x27;t be fair.</p>

<p>What does this mean in practice, and why? For classes that are taken through the STEM program, many are equivalent to credit (like PE) that students would earn at the high school level, and the rigor of those classes is equivalent. Reference sources: Data Source Doc; Presentation.</p>

<p>Research: How Other Wisconsin Districts Weight Grades Wauwatosa (Wauwatosa West &amp; East High)</p>
<p class="li">• Weighted: Advanced Placement and dual credit courses through UW–Green Bay only — even for transfer or virtual courses, only those classes are weighted.</p>
<p class="li">• Scale: .025 credits added for every .5 credits; 5.0 scale.</p>
<p class="li">• Seniors/college admissions: transcripts state that weighted grades were introduced during the 2025–2026 school year.</p>
<p class="li">• Why chosen: accessible to all students at both high schools; taught by Wauwatosa teachers; curriculum integrity has external oversight (College Board for AP; UW–Green Bay for dual enrollment); students can earn college credit.</p>
<p class="li">• Not retroactive for 10th → 12th graders.</p>
<p>Elmbrook (Brookfield East High)</p>
<p class="li">• Adds 0.025 per completed semester/half-credit (total 0.05 extra per one-credit course) on a traditional 4.0 scale.</p>
<p class="li">• Weighted: Advanced Placement, Level 5 World Language, specific advanced classes beyond standard capstones, Early College Credit Program, Start College Now.</p>
<p class="li">• No official class rank.</p>
<p>Middleton</p>
<p class="li">• AP courses on a 5.0 scale.</p>
<p class="li">• Open to weighting more courses after looking at 1–2 years of data.</p>
<p class="li">• Wanted to make the &quot;smallest change possible&quot; because Act 95 only affected about 30 people in each graduating class.</p>
<p class="li">• Concern noted: a weighted GPA could increase pressure on students to take AP courses rather than choosing classes based on their true interests. Weighting other higher-level classes could help.</p>

<h4>Explainer: How the SPASD Budget Works</h4>
<h4>p. 178</h4>
<p>Next Year&#x27;s Budget (2027–28) The 2027–28 district budget hasn&#x27;t been released yet. When it is, this page will explain it in plain language using the same format as the August budget explainer in Part 4: where the money comes from, where it goes, what changed from last year, and when the public can comment.</p>
<p>Question Packet for Matt Clark DISTRICT BUDGET &amp; LONG-TERM FINANCIAL PLANNING — Meeting Briefing &amp; Question Packet Prepared for Matt Clark, Director of Business &amp; Finance, Sun Prairie Area School District. Prepared by Zackary Mark, a district high school. Meeting focus: Budgeting process, long-range planning, financial pressures, priorities, and student impact. Target length: 45–60 minutes.</p>
<p>Purpose This packet is designed to help structure a student-led conversation about how SPASD makes financial decisions, how it plans beyond one school year, what constraints it faces, and how financial choices translate into student and staff outcomes. The goal is understanding first, evaluation second. The strongest questions are designed to uncover the assumptions, tradeoffs, timelines, and measurable outcomes behind the numbers. Important note: Some figures below are historical or were published for the 2024 referendum. They are included as context, not as claims about the current 2026–27 budget. Where a current figure is needed, the question packet asks Mr. Clark to provide the latest number.</p>
<p class="li">1. Executive Briefing Why this meeting matters SPASD identifies Business Services as responsible for fiscal management, long-range financial planning, new facility planning, transportation, purchasing, payroll, accounts payable, and open enrollment. The district also publicly provides annual meeting reports, budget information, enrollment projections, financial audits, bond information, debt structure,</p>
<p>and long-term debt-service information. The district&#x27;s current Business Services page lists a 2026–27 Strategic Based Budget &amp; Staffing Planning Calendar and a 2025–26 Adopted Budget, alongside a 2026 UW Applied Population Lab enrollment projection report. That makes this meeting an opportunity to connect documents that are publicly available with the decision-making process behind them.</p>
<p>Core objective</p>
<p class="li">• Understand the district&#x27;s budget cycle from assumptions to Board approval.</p>
<p class="li">• Understand how SPASD models multiple years rather than balancing only one annual budget.</p>
<p class="li">• Identify the largest recurring financial pressures and which are within district control.</p>
<p class="li">• Understand how enrollment, staffing, state funding, property values, debt, and referenda interact.</p>
<p class="li">• Understand what financial indicators the district watches to avoid future structural deficits.</p>
<p class="li">• Connect financial decisions to measurable outcomes for students, staff, programs, and facilities.</p>
<p>Student-voice connection Existing SPASD advocacy work has emphasized student voice, transparency, consistency, and follow-through. The financial version of that principle is simple: students should be able to understand, at an age-appropriate level, why major financial decisions are made and what outcomes those decisions are intended to produce. Prior work around Act 95, weighted grading, Student Senate, and districtwide student engagement gives a useful lens for asking not only &quot;What does this cost?&quot; but also &quot;What problem does this spending solve, and how will we know it worked?&quot;</p>
<p class="li">2. Research &amp; Data Snapshot</p>
<p class="li">A. What SPASD currently makes public</p>
<p class="li">• Business Services says it is responsible for fiscal management and long-range financial planning.</p>
<p class="li">• The district lists a 2026–27 Strategic Based Budget &amp; Staffing Planning Calendar.</p>
<p class="li">• The district lists a 2025–26 Adopted Budget, prior adopted budgets, financial audits, a bond-rating report, current debt structure, and long-term debt-service information.</p>
<p class="li">• The district lists a 2026 UW-APL enrollment projection report and a 2023 Roffers community growth/projections report.</p>
<p class="li">• SPASD provides a Revenue Caps 101 video and links to the Wisconsin budget process.</p>
<p class="li">B. 2024 operating referendum context The 2024 SPASD referendum asked voters to authorize up to $25 million in additional annual operating authority. The district described the funding as a way to stabilize the budget, support competitive compensation, and support programming for a growing and increasingly complex student population. Voters approved the measure 57% to 43%.</p>
<p>The district&#x27;s referendum materials allocated the authority conceptually across three major areas: $4 million for educational programming, $7 million for competitive staff compensation and benefits, and $14 million to stabilize operating expenses. The district stated that without the referendum it projected a $6 million deficit for 2025–26 and a deficit growing to $14 million in subsequent years. These were pre-referendum projections and should be treated as historical context. The key current question is how the actual financial position compares with those projections.</p>
<p class="li">C. Tax and funding context In its 2024 tax-impact explanation, SPASD said 187 new students joined the district that year and that enrollment growth affected staffing, transportation, and other costs. The district also cited changes in state aid, special education and language-service needs, private-school voucher/charter costs, and debt payments as factors affecting the tax levy. The district reported that the 2023–24 mill rate was $9.86 and said it had declined from $13.06 in 2019–20. The district also reported that from 2010–2024 it received $3,300 less per student than it would have received if state funding had kept pace with inflation, according to its referendum materials.</p>
<p class="li">D. Wisconsin finance constraint Wisconsin&#x27;s revenue-limit system constrains how school districts can raise certain operating revenues through property taxes. DPI&#x27;s revenue-limit system uses pupil membership and other inputs to calculate district revenue limits. This is why a district&#x27;s budget conversation cannot be reduced to &quot;just spend less&quot; or &quot;just raise taxes.&quot; The relevant question is which revenue sources and spending categories are flexible, restricted, recurring, or one-time.</p>
<p class="li">3. Priority Questions for Matt Clark Use these as a conversation map rather than a checklist. The best follow-up question is usually: &quot;What does that look like in the numbers?&quot;</p>
<p class="li">A. Budget construction</p>
<p class="li">1. Can you walk me through the SPASD budget process from the first assumptions to the final Board-approved budget?</p>
<p class="li">2. What are the major decisions that have to be made before the public sees a proposed budget?</p>
<p class="li">3. Which parts of the budget are relatively fixed, and which parts can the district realistically change within one year?</p>
<p class="li">4. What assumptions are most important in building the 2026–27 budget?</p>
<p class="li">5. How does the district test whether those assumptions are realistic?</p>
<p class="li">B. Long-term financial planning</p>
<p class="li">6. How many years into the future does SPASD formally model its finances?</p>
<p class="li">7. What does the district&#x27;s long-term financial model currently show for the next 3, 5, and 10 years?</p>
<p class="li">8. What are the biggest financial risks in that model?</p>
<p class="li">9. What assumptions would have to change for the district to move from a stable outlook to a structural deficit?</p>
<p class="li">10. What financial indicators would give you an early warning that the district is heading toward a problem?</p>
<p class="li">C. Revenue and state funding</p>
<p class="li">11. How dependent is SPASD on state aid versus local property taxes and other revenue sources?</p>
<p class="li">12. How does Wisconsin&#x27;s revenue-limit system affect the district&#x27;s ability to respond to rising costs?</p>
<p class="li">13. What state-level changes would have the biggest positive or negative effect on SPASD&#x27;s long-term finances?</p>
<p class="li">14. How does enrollment growth translate into additional revenue, and how quickly does the cost of serving those students appear?</p>
<p class="li">4. Deep-Dive Questions</p>
<p class="li">D. Staffing and compensation</p>
<p class="li">15. What percentage of the operating budget is tied to employee compensation and benefits?</p>
<p class="li">16. How does SPASD determine whether compensation is competitive with neighboring Dane County districts?</p>
<p class="li">17. How are staffing decisions made when enrollment changes?</p>
<p class="li">18. How does the district balance competitive pay with maintaining class sizes and student programs?</p>
<p class="li">19. How are hard-to-fill positions or specialized services accounted for in long-term planning?</p>
<p class="li">E. Enrollment, facilities, and growth</p>
<p class="li">20. How are the 2026 UW-APL enrollment projections being incorporated into financial planning?</p>
<p class="li">21. What enrollment trend would require the district to change staffing, boundaries, facilities, or programming?</p>
<p class="li">22. How does the district financially plan for major facility maintenance before a building reaches a crisis point?</p>
<p class="li">23. How do operating costs of buildings factor into long-term facilities decisions?</p>
<p class="li">24. How are debt payments and future capital needs modeled alongside the operating budget?</p>
<p class="li">F. Referendum and accountability</p>
<p class="li">25. The 2024 referendum was presented as a long-term response to structural financial pressure. What has changed since voters approved it?</p>
<p class="li">26. How closely are actual revenues and expenses tracking the assumptions used when the referendum was presented?</p>
<p class="li">27. What outcomes are being used to determine whether referendum-supported spending is producing the intended student and staff benefits?</p>
<p class="li">28. What would make the district consider seeking additional operating authority before the referendum&#x27;s stated five-year roll-in period ends?</p>
<p class="li">29. How does the district ensure recurring referendum revenue is not used to create an unsustainable future spending commitment?</p>
<p class="li">G. Student impact</p>
<p class="li">30. When the district has to choose between competing priorities, how is student impact weighed?</p>
<p class="li">31. Are there districtwide metrics that connect spending to student outcomes, staffing stability, program access, or school climate?</p>
<p class="li">32. How can students better understand the district&#x27;s financial decisions without reducing complex issues to slogans?</p>
<p class="li">33. Is there a meaningful role for students or a student advisory group in conversations about budget priorities?</p>
<p class="li">5. Numbers &amp; Documents to Request</p>
<p class="li">• Current financial position: Current-year revenue, expenditures, projected year-end position, fund balances, and major variances.</p>
<p class="li">• 2026–27 budget: Adopted or proposed total budget, major fund categories, major revenue sources, and major expenditure categories.</p>
<p class="li">• Multi-year forecast: 3-, 5-, and ideally 10-year forecast with major assumptions.</p>
<p class="li">• Staffing: FTE trends, compensation/benefit share of expenditures, and major staffing assumptions.</p>
<p class="li">• Enrollment: Current enrollment, 3–5 year trend, and 2026 UW-APL projection assumptions used in budgeting.</p>
<p class="li">• Debt: Outstanding principal, annual debt service, maturity schedule, and major future capital obligations.</p>
<p class="li">• Fund balance: Current reserves by fund, district policy targets, and how reserves are used in long-term planning.</p>
<p class="li">• Referendum tracking: Actual referendum revenue received and how it has been allocated compared with the original plan.</p>
<p class="li">• Capital planning: Major facility projects expected in the next 5–10 years and how they are financed.</p>
<p class="li">• Risk analysis: Top 5 financial risks and the indicators the district monitors for each.</p>
<p>A particularly useful question: &quot;If you could give a student one chart that explains the district&#x27;s financial position better than anything else, what would you put on it?&quot; That question forces the conversation toward the indicators the finance office actually uses, rather than a pile of disconnected budget numbers.</p>
<p class="li">6. Suggested 45–60 Minute Meeting Flow</p>
<p class="li">• 0–5 min — Introduction: Thank Matt for meeting; explain that the goal is to understand the system, not audit him.</p>
<p class="li">• 5–15 min — How the budget works: Ask for the annual budget cycle and the biggest decision points.</p>
<p class="li">• 15–30 min — Long-term outlook: Focus on multi-year forecasting, enrollment, staffing, state funding, and structural risks.</p>
<p class="li">• 30–42 min — Referendum &amp; priorities: Compare the 2024 assumptions with current reality; ask about outcomes and sustainability.</p>
<p class="li">• 42–52 min — Student impact: Ask how spending decisions connect to student outcomes and student voice.</p>
<p class="li">• 52–60 min — Documents &amp; next steps: Request key documents, clarify follow-up, and identify one useful next conversation.</p>
<p>Live notes: Key numbers / Biggest financial pressure / Biggest long-term risk / Most important assumption / Student impact connection / Documents promised / Follow-up date / person / One idea worth pursuing. Closing test: Before leaving, you should be able to explain in plain language: where the district gets its money, where most of it goes, what limits the district&#x27;s choices, what the next five years look like, and what would cause that outlook to change.</p>
<p class="li">7. Sources &amp; Research Notes</p>
