<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Student Voice Admin</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b3a66">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Public+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="admin.css">
<script>if(window.top!==window.self)document.documentElement.classList.add('embed');</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<section id="login" class="login" hidden>
  <div class="lcard">
    <img src="icon-192.png" alt="" width="56" height="56">
    <h1>Student Voice Admin</h1>
    <p class="sub" id="lmsg">Log in to manage the site.</p>
    <form id="pwform">
      <label>Email <span class="opt">(leave blank if you're the owner)</span><input type="email" id="lemail" autocomplete="username"></label>
      <label>Password<input type="password" id="lpw" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Log in</button>
    </form>
    <div id="gbox" hidden><div class="or">or</div><div id="gbtn"></div></div>
    <form id="magicform" hidden><div class="or">or get a login link by email</div>
      <label class="vh" for="memail">Email</label><input type="email" id="memail" placeholder="you@example.com" required>
      <button class="btn" type="submit">Email me a link</button></form>
    <p class="err" id="lerr" role="alert"></p>
    <p class="sub notembed"><a href="/">Back to the site</a></p>
  </div>
</section>

<div id="app" hidden>
  <header class="top">
    <button class="iconbtn menu" id="menubtn" aria-label="Menu" aria-expanded="false">☰</button>
    <a class="brand" href="#today"><img src="icon-192.png" alt="" width="26" height="26">Admin</a>
    <button class="searchbtn" id="searchbtn" aria-label="Search everything (press /)"><span>Search everything</span><kbd>/</kbd></button>
    <button class="iconbtn" id="themebtn" aria-label="Light or dark mode"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
    <a class="iconbtn notembed" href="/" target="_blank" rel="noopener" aria-label="Open the site">↗</a>
    <button class="iconbtn" id="logoutbtn" aria-label="Log out">⏻</button>
  </header>
  <nav class="side" id="side" aria-label="Admin sections"></nav>
  <main id="main" tabindex="-1"></main>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="mcard"><h2 id="mtitle"></h2><div id="mbody"></div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
